<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Galaga Remaster</title>
<style>
body{
margin:0;
background:black;
overflow:hidden;
color:white;
font-family:Arial;
text-align:center;
}

canvas{
background:black;
display:block;
margin:auto;
}

#mensajeFinal{
display:none;
position:absolute;
top:40%;
width:100%;
font-size:28px;
}

#cofre{
font-size:60px;
display:none;
}
</style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="mensajeFinal">
<div id="cofre">💎</div>
<br>
RECOMPENSA PARA ANALI
<br><br>
Anali, durante todo este juego pensé en algo.
Me di cuenta que me gusta pasar tiempo contigo,
hablar contigo y conocerte más.

Así que quería decirte algo sencillo pero sincero:

¿Te gustaría que nos sigamos conociendo más?

Att: Gael
</div>

<script>

let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let player = {
x:180,
y:540,
w:40,
h:20
};

let bullets=[];
let enemies=[];
let score=0;
let gameOver=false;

for(let i=0;i<30;i++){
enemies.push({
x:Math.random()*360,
y:Math.random()*200,
w:30,
h:20,
speed:1+Math.random()*2
});
}

document.addEventListener("keydown",function(e){

if(e.key=="ArrowLeft") player.x-=20;
if(e.key=="ArrowRight") player.x+=20;

if(e.key==" "){
bullets.push({
x:player.x+18,
y:player.y
});
}

});

function update(){

if(gameOver)return;

for(let b of bullets){
b.y-=6;
}

for(let e of enemies){
e.y+=e.speed;

if(e.y>600){
e.y=0;
e.x=Math.random()*360;
}
}

for(let b of bullets){
for(let e of enemies){

if(
b.x<e.x+e.w &&
b.x+5>e.x &&
b.y<e.y+e.h &&
b.y+10>e.y
){
score++;
e.y=-20;
e.x=Math.random()*360;
}

}
}

if(score>50){
gameOver=true;
document.getElementById("mensajeFinal").style.display="block";
document.getElementById("cofre").style.display="block";
}

}

function draw(){

ctx.clearRect(0,0,400,600);

ctx.fillStyle="white";
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle="red";
for(let b of bullets){
ctx.fillRect(b.x,b.y,5,10);
}

ctx.fillStyle="lime";
for(let e of enemies){
ctx.fillRect(e.x,e.y,e.w,e.h);
}

ctx.fillStyle="white";
ctx.fillText("Score: "+score,10,20);

}

function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
