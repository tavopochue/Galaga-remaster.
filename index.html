<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galaga Remaster</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

canvas{
background:black;
display:block;
margin:auto;
}

#menu{
position:absolute;
top:40%;
width:100%;
}

#menu button{
font-size:25px;
padding:15px 40px;
}

#hud{
position:absolute;
top:10px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
font-size:18px;
}

#controls{
position:fixed;
bottom:20px;
width:100%;
display:flex;
justify-content:center;
gap:20px;
}

.ctrl{
width:80px;
height:70px;
font-size:30px;
background:#222;
color:white;
border-radius:10px;
border:none;
}

</style>
</head>

<body>

<div id="menu">
<h1>GALAGA REMASTER</h1>
<button id="startBtn">START</button>
</div>

<div id="hud">
<div id="score">SCORE 0</div>
<div id="level">LEVEL 1</div>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div id="controls">
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="shoot">🔥</button>
<button class="ctrl" id="right">▶</button>
</div>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

let running=false

let player={x:200,y:540}

let bullets=[]
let enemies=[]
let stars=[]

let left=false
let right=false

let score=0
let level=1

for(let i=0;i<120;i++){
stars.push({
x:Math.random()*400,
y:Math.random()*600,
speed:Math.random()*1+0.5
})
}

function spawnEnemies(){

enemies=[]

for(let r=0;r<3;r++){
for(let c=0;c<6;c++){

enemies.push({
x:60+c*50,
y:80+r*40,
alive:true
})

}
}

}

function shoot(){

if(!running)return

bullets.push({
x:player.x,
y:player.y
})

}

function update(){

if(!running)return

if(left) player.x-=5
if(right) player.x+=5

player.x=Math.max(20,Math.min(380,player.x))

stars.forEach(s=>{
s.y+=s.speed
if(s.y>600)s.y=0
})

bullets.forEach(b=>b.y-=8)

bullets.forEach((b,bi)=>{
enemies.forEach(e=>{

if(e.alive &&
Math.abs(b.x-e.x)<15 &&
Math.abs(b.y-e.y)<15){

e.alive=false
bullets.splice(bi,1)

score+=10
document.getElementById("score").innerText="SCORE "+score

}

})
})

if(enemies.every(e=>!e.alive)){

level++
document.getElementById("level").innerText="LEVEL "+level

spawnEnemies()

}

}

function draw(){

ctx.clearRect(0,0,400,600)

ctx.fillStyle="white"

stars.forEach(s=>{
ctx.fillRect(s.x,s.y,2,2)
})

ctx.fillStyle="cyan"

ctx.beginPath()
ctx.moveTo(player.x,player.y)
ctx.lineTo(player.x-15,player.y+20)
ctx.lineTo(player.x+15,player.y+20)
ctx.closePath()
ctx.fill()

ctx.fillStyle="yellow"

bullets.forEach(b=>{
ctx.fillRect(b.x-2,b.y,4,10)
})

ctx.fillStyle="red"

enemies.forEach(e=>{
if(e.alive){
ctx.fillRect(e.x-15,e.y-10,30,20)
}
})

}

function loop(){
