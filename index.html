<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kombat Presidencial</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
}

#menu{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
}

#menu h1{
font-size:60px;
color:red;
text-shadow:0 0 20px red;
}

#menu button{
padding:15px 40px;
font-size:25px;
background:#aa0000;
border:none;
color:white;
cursor:pointer;
}

canvas{
display:none;
background:linear-gradient(#111,#000);
}

#hud{
position:absolute;
top:10px;
width:100%;
display:none;
justify-content:space-between;
padding:0 50px;
}

.bar{
width:300px;
height:25px;
background:#400;
border:2px solid #fff;
}

.life{
height:100%;
background:red;
}

#controls{
position:absolute;
bottom:20px;
width:100%;
display:none;
justify-content:center;
gap:20px;
}

.btn{
width:70px;
height:70px;
border-radius:50%;
border:none;
font-size:25px;
background:#333;
color:white;
}

</style>
</head>

<body>

<div id="menu">
<h1>KOMBAT PRESIDENCIAL</h1>
<button onclick="startGame()">START</button>
</div>

<div id="hud">
<div class="bar"><div id="life1" class="life"></div></div>
<div class="bar"><div id="life2" class="life"></div></div>
</div>

<canvas id="game" width="900" height="500"></canvas>

<div id="controls">
<button class="btn" id="left">⬅</button>
<button class="btn" id="right">➡</button>
<button class="btn" id="punch">👊</button>
</div>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

let player={x:150,y:350,w:70,h:120,life:100}
let enemy={x:650,y:350,w:70,h:120,life:100}

let moveL=false
let moveR=false

// sonido usando WebAudio
let audioCtx
function playHit(){
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)()
let osc=audioCtx.createOscillator()
let gain=audioCtx.createGain()

osc.type="square"
osc.frequency.value=200
gain.gain.value=0.1

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
osc.stop(audioCtx.currentTime+0.1)
}

// música simple
function playMusic(){
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)()
let osc=audioCtx.createOscillator()
let gain=audioCtx.createGain()

osc.type="sawtooth"
osc.frequency.value=120
gain.gain.value=0.02

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
}

// iniciar juego
function startGame(){

document.getElementById("menu").style.display="none"
canvas.style.display="block"
document.getElementById("hud").style.display="flex"
document.getElementById("controls").style.display="flex"

playMusic()

loop()

}
